[env]
TERM = "xterm-256color"

# pegar texto. Alt+V 
#[[keyboard.bindings]]
#key = "V"
#mods = "Alt"
#action = "Paste"
#


[keyboard]
bindings = [
    # Pegar sin esfuerzo  
    { key = "V", mods = "Alt", action = "Paste" },
    # Abrir nueva ventana
    { key = "N", 
    mods = "Control|Shift", 
    action = "SpawnNewInstance"
    }
]

