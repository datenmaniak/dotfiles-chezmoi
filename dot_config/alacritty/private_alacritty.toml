[window]
opacity = 1.0
decorations = "Full"
dynamic_title = true
startup_mode = "Windowed"
padding = { x = 8, y = 8 }



[font.offset]
x = 0
y = 3 # Más espacio vertical para reducir la fatiga en lecturas largas



[font]
# VictorMono para itálicas fluidas y JetBrains para legibilidad técnica
normal = { family = "UbuntuSansMono Nerd Font", style = "Regular" }
#normal = { family = "JetBrainsMono Nerd Font", style = "Medium" }
#normal = { family = "VictorMono Nerd Font", style = "Bold" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
#italic = { family = "VictorMono Nerd Font", style = "Italic" }
size = 13 # Ajusta este valor según la pantalla para que no uses zoom


[scrolling]
history = 100000
multiplier = 3

[selection]
save_to_clipboard = false

[terminal]
shell = { program = "/usr/bin/tmux", args = ["new-session"] }
#shell = { program = "/usr/bin/tmux", args = ["new-session", "-A", "-s", "main"] }

[general]
live_config_reload = true
import = [
  #   "~/.config/alacritty/themes/themes/tokyo_night_storm.toml"
